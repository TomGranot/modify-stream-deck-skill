<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Modify Stream Deck</title>
  <desc id="desc">A six-key Stream Deck with programmable actions flowing into desktop apps.</desc>
